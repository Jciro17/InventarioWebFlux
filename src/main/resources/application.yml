server:
  port: 8081

spring:
  application:
    name: inventario-webflux

# Cliente de MessageUcoLab. La aplicación y el ambiente los deduce MessageUcoLab del client_id de la identidad.
messageucolab:
  url: ${MESSAGEUCOLAB_URL:http://localhost:8000}

security:
  # Esta demo no protege sus propias rutas con el PEP; solo consume MessageUcoLab.
  enabled: false
  pep:
    # Identidad de servicio de Inventario. El client_id y el client_secret llegan desde Doppler.
    service-identity:
      enabled: true
      token-uri: ${KEYCLOAK_TOKEN_URI:http://keycloak.localhost:19090/realms/security-baseline/protocol/openid-connect/token}
      client-id: ${MESSAGEUCOLAB_CLIENT_ID:}
      client-secret: ${MESSAGEUCOLAB_CLIENT_SECRET:}

logging:
  level:
    co.edu.uco: DEBUG
    org.springframework.web.reactive: WARN


messageucolab:
  url: ${MESSAGEUCOLAB_URL:http://localhost:8000}
  application-id: ${MESSAGEUCOLAB_APPLICATION_ID:fbba6963-e877-4199-b616-36c582ba398b}
  environment-id: ${MESSAGEUCOLAB_ENVIRONMENT_ID:3ba3dc6a-0964-4255-9a8f-3cf734958ee9}
  # Prefijo del topic de avisos; el topic final es <prefijo>-<environment-id>.
  events-topic-prefix: ${MESSAGEUCOLAB_EVENTS_TOPIC_PREFIX:persistent://public/default/message-events}
  # La suscripción es Exclusive: cada instancia que corra a la vez necesita un nombre distinto.
  subscription-name: ${MESSAGEUCOLAB_SUBSCRIPTION_NAME:inventario-webflux}

pulsar:
  # Puerto publicado de Pulsar en el host (PULSAR_PORT en Doppler). Aquí es 6800 -> 6650 del contenedor.
  service-url: ${PULSAR_URL:pulsar://localhost:6800}

